# macOS 설치 파일(.dmg)을 만든다. Apple Silicon(arm64)용.
# 손으로 돌리거나(Actions 탭 → macOS package → Run workflow) mac-build 브랜치에 push하면 돈다.
# 결과는 실행 화면의 Artifacts(DBaro-macos-arm64)에서 받는다.
name: macOS package

on:
  workflow_dispatch:
  push:
    branches: [mac-build]

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          aqtversion: '==3.3.*'

      - name: Build the package
        run: bash scripts/package-macos.sh --qt-dir "$QT_ROOT_DIR" --run-tests

      - name: Launch the app
        run: |
          app="$(ls -d dist/DBaro-*-macos-*/DBaro.app)"
          "$app/Contents/MacOS/dbaro" > dist/launch.log 2>&1 &
          pid=$!
          sleep 15
          screencapture -x dist/launch.png || true
          if ! kill -0 "$pid" 2>/dev/null; then
            cat dist/launch.log
            echo "DBaro exited right after starting."
            exit 1
          fi
          kill "$pid"
          cat dist/launch.log

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: DBaro-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload the launch check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-check
          path: |
            dist/launch.png
            dist/launch.log
          if-no-files-found: ignore
